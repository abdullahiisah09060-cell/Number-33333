<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Executive Mainframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; --emerald: #10b981; }
        body { background: #f1f5f9; font-family: 'Public Sans', sans-serif; padding-bottom: 100px; }
        .header-bg { background: linear-gradient(135deg, #001a3d 0%, var(--sba-blue) 100%); padding: 30px 20px 80px; border-bottom: 5px solid var(--sba-red); border-radius: 0 0 30px 30px; }
        .balance-card { background: white; border-radius: 20px; padding: 25px; margin: -50px 15px 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        .dot { width: 12px; height: 12px; background: #e2e8f0; border-radius: 50%; transition: 0.4s; }
        .dot.active { background: var(--emerald); box-shadow: 0 0 10px var(--emerald); }
        .nav-dock { position: fixed; bottom: 0; left: 0; right: 0; background: white; height: 80px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ddd; z-index: 100; }
        .cert-card { background: linear-gradient(to right, #fff, #f8fafc); border-left: 5px solid #d4af37; }
    </style>
</head>
<body>

    <div class="header-bg flex justify-between items-center text-white">
        <div>
            <h2 id="uName" class="text-xl font-black uppercase tracking-tighter">AUTHENTICATING...</h2>
            <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Federal Node V15.4</p>
        </div>
        <button onclick="signOut(auth)" class="bg-red-600 text-[10px] font-black px-4 py-2 rounded uppercase">Logoff</button>
    </div>

    <div class="balance-card">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Current Grant Allocation</p>
        <h2 id="balance" class="text-4xl font-black text-[#002e6d] mt-2 tracking-tighter">$0.00</h2>
        
        <div class="grid grid-cols-4 gap-4 mt-8">
            <a href="apply.html" class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 bg-slate-50 border rounded-xl flex items-center justify-center text-blue-800"><i class="fas fa-file-contract"></i></div>
                <span class="text-[9px] font-black uppercase text-slate-500">Apply</span>
            </a>
            <a href="withdraw.html" class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 bg-slate-50 border rounded-xl flex items-center justify-center text-blue-800"><i class="fas fa-paper-plane"></i></div>
                <span class="text-[9px] font-black uppercase text-slate-500">Payout</span>
            </a>
            <a href="tax.html" class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 bg-slate-50 border rounded-xl flex items-center justify-center text-blue-800"><i class="fas fa-landmark"></i></div>
                <span class="text-[9px] font-black uppercase text-slate-500">IRS</span>
            </a>
            <a href="settings.html" class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 bg-slate-50 border rounded-xl flex items-center justify-center text-blue-800"><i class="fas fa-cog"></i></div>
                <span class="text-[9px] font-black uppercase text-slate-500">Vault</span>
            </a>
        </div>
    </div>

    <a href="award.html" class="cert-card mx-4 p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between mb-6">
        <div class="flex items-center gap-4">
            <div class="text-yellow-600 text-3xl"><i class="fas fa-award"></i></div>
            <div>
                <p class="text-[12px] font-black text-slate-800 uppercase">Recognition Certificate</p>
                <p class="text-[9px] text-slate-400 font-bold uppercase">Official Grant Approval Document</p>
            </div>
        </div>
        <i class="fas fa-chevron-right text-slate-300"></i>
    </a>

    <div class="mx-4 mb-6">
        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 px-1">Recent Activity</h3>
        <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
            <div id="txList" class="divide-y divide-slate-50">
                <p class="p-6 text-center text-[10px] font-bold text-slate-300 uppercase">Scanning Ledger...</p>
            </div>
        </div>
    </div>

    <div class="mx-4 p-6 bg-white rounded-2xl border border-slate-100 mb-8">
        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Pipeline Status</h3>
        <div class="flex justify-between px-2">
            <div class="flex flex-col items-center gap-2">
                <div class="dot active"></div>
                <span class="text-[8px] font-black uppercase">Start</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="dot" id="dot-kyc"></div>
                <span class="text-[8px] font-black uppercase">ID-Scan</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="dot" id="dot-tax"></div>
                <span class="text-[8px] font-black uppercase">Tax-V</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="dot" id="dot-payout"></div>
                <span class="text-[8px] font-black uppercase">Funded</span>
            </div>
        </div>
    </div>

    <nav class="nav-dock">
        <a href="dashboard.html" class="flex flex-col items-center text-blue-900"><i class="fas fa-home"></i><span class="text-[9px] font-black mt-1">HOME</span></a>
        <a href="ledger.html" class="flex flex-col items-center text-slate-400"><i class="fas fa-list"></i><span class="text-[9px] font-black mt-1">LEDGER</span></a>
        <a href="support.html" class="flex flex-col items-center text-slate-400"><i class="fas fa-headset"></i><span class="text-[9px] font-black mt-1">HELP</span></a>
    </nav>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { doc, onSnapshot, collection, query, limit, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        window.signOut = signOut;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Live Update Profile & Balance
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    const d = snap.data();
                    document.getElementById('uName').innerText = d.fullName.toUpperCase();
                    document.getElementById('balance').innerText = `$${d.balance.toLocaleString()}`;
                    
                    if(d.kycStatus === 'SUCCESSFUL') document.getElementById('dot-kyc').classList.add('active');
                    if(d.taxStatus === 'SUCCESSFUL') document.getElementById('dot-tax').classList.add('active');
                    if(d.withdrawStatus === 'SUCCESSFUL') document.getElementById('dot-payout').classList.add('active');
                });

                // Load Recent Transactions
                const q = query(collection(db, "users", user.uid, "transactions"), orderBy("timestamp", "desc"), limit(2));
                onSnapshot(q, (qs) => {
                    const txList = document.getElementById('txList');
                    txList.innerHTML = '';
                    if(qs.empty) {
                        txList.innerHTML = '<p class="p-6 text-center text-[10px] font-bold text-slate-300 uppercase">No Recent Node Activity</p>';
                        return;
                    }
                    qs.forEach(doc => {
                        const t = doc.data();
                        txList.innerHTML += `
                            <div class="p-4 flex justify-between items-center">
                                <div>
                                    <p class="text-[11px] font-black uppercase text-slate-800">${t.type}</p>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase">${t.status}</p>
                                </div>
                                <p class="text-[12px] font-black text-slate-800">$${t.amount.toLocaleString()}</p>
                            </div>
                        `;
                    });
                });
            } else { window.location.href = "login.html"; }
        });
    </script>
</body>
</html>
