<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Federal Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; --bg: #f8fafc; }
        
        body { background: var(--bg); font-family: "Public Sans", sans-serif; margin: 0; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .gov-banner { background: #000; color: white; font-size: 8px; padding: 10px; text-align: center; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; border-bottom: 3px solid var(--sba-red); position: sticky; top: 0; z-index: 1001; }
        
        .header-main { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 31px; z-index: 1000; }
        .logo-frame { border: 2.5px solid var(--sba-blue); border-bottom-color: var(--sba-red); border-left-color: var(--sba-red); padding: 2px 6px; font-weight: 900; color: var(--sba-blue); font-size: 18px; }
        
        .summary-card { background: linear-gradient(135deg, var(--sba-blue) 0%, #001a3d 100%); border-radius: 18px; padding: 20px; color: white; box-shadow: 0 15px 30px -10px rgba(0,46,109,0.3); }
        
        .search-box { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .search-box input { border: none; outline: none; width: 100%; font-size: 12px; font-weight: 600; color: var(--sba-blue); }

        .ledger-wrapper { background: white; border-radius: 18px; overflow: hidden; border: 1px solid #e2e8f0; }
        .ledger-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .ledger-table th { background: #f8fafc; text-align: left; padding: 10px 15px; color: #64748b; font-size: 8px; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
        .ledger-table td { padding: 15px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
        
        .date-display { font-size: 8px; font-weight: 900; color: var(--sba-blue); opacity: 0.6; display: block; margin-bottom: 2px; }
        .desc-main { font-size: 12px; font-weight: 800; color: var(--sba-blue); text-transform: uppercase; line-height: 1.2; }
        .amt-display { font-size: 14px; font-weight: 900; font-family: 'JetBrains Mono'; margin-top: 4px; display: block; }
        
        .status-pill { padding: 3px 8px; border-radius: 5px; font-size: 7px; font-weight: 900; text-transform: uppercase; display: inline-block; white-space: nowrap; border: 1px solid transparent; }
        .pill-pending { background: #fff7ed; color: #9a3412; border-color: #ffedd5; }
        .pill-cleared { background: #f0fdf4; color: #166534; border-color: #dcfce7; }
        .pill-declined { background: #fef2f2; color: #991b1b; border-color: #fee2e2; }

        .reason-box { background: #fff1f2; border-left: 3px solid #e11d48; padding: 8px; border-radius: 4px; margin-top: 8px; font-size: 9px; color: #9f1239; font-weight: 700; line-height: 1.3; }
    </style>
</head>
<body class="pb-10">

    <div class="gov-banner">Federal Archive • Registry: T-104-B</div>

    <header class="header-main">
        <div class="flex items-center gap-2">
            <div class="logo-frame">SBA</div>
            <p class="text-[10px] font-black text-[#002e6d] truncate max-w-[120px]" id="ledgerRef">REF: ...</p>
        </div>
        <a href="dashboard.html" class="text-[9px] font-black uppercase text-white bg-[#002e6d] px-3 py-2 rounded-lg">Exit</a>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4">
        
        <div class="summary-card mb-5">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-[8px] font-black uppercase opacity-60 tracking-wider">Available Balance</p>
                    <h2 class="text-2xl font-black mt-1" id="totalBalance">$0.00</h2>
                </div>
                <div class="text-right">
                    <p class="text-[8px] font-black uppercase opacity-60">Status</p>
                    <div id="syncStatus" class="text-[9px] font-black text-blue-300 mt-1 uppercase">
                        <i class="fas fa-circle-notch fa-spin"></i> Syncing
                    </div>
                </div>
            </div>
        </div>

        <div class="search-box">
            <i class="fas fa-search text-slate-400 text-xs"></i>
            <input type="text" id="ledgerSearch" placeholder="Search transactions...">
        </div>

        <div class="ledger-wrapper">
            <table class="ledger-table">
                <thead>
                    <tr>
                        <th width="70%">Transaction Details</th>
                        <th width="30%" class="text-right">Status</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody">
                    <tr><td colspan="2" class="py-10 text-center text-[10px] font-black text-slate-300 uppercase">Connecting to Secure Server...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6 p-4 bg-slate-100 rounded-xl border-l-4 border-sba-blue">
            <p class="text-[8px] font-black text-sba-blue uppercase mb-1">Audit Notice</p>
            <p class="text-[10px] text-slate-500 font-bold leading-tight">All digital transfers are subject to Federal Audit. Updates may take 2-4 minutes to reflect.</p>
        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        let currentData = [];

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            
            document.getElementById('ledgerRef').innerText = `REF: ${user.uid.substring(0,10).toUpperCase()}`;

            onSnapshot(doc(db, "users", user.uid), (snap) => {
                const data = snap.data();
                if (!data) return;

                document.getElementById('totalBalance').innerText = `$${Number(data.balance || 0).toLocaleString()}`;
                document.getElementById('syncStatus').innerHTML = `<i class="fas fa-check-circle"></i> Live`;
                document.getElementById('syncStatus').className = "text-[9px] font-black text-emerald-400 mt-1 uppercase";

                const history = Array.isArray(data.history) ? data.history : [];
                const ledger = Array.isArray(data.ledger) ? data.ledger : [];
                
                // Merge and De-duplicate (Show latest version of any specific amount/type)
                const merged = [...history, ...ledger].sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
                const seen = new Set();
                currentData = [];

                merged.forEach(item => {
                    const id = `${item.amount}-${item.type}`;
                    if(!seen.has(id)) {
                        currentData.push(item);
                        seen.add(id);
                    }
                });

                if(data.totalAward) {
                    currentData.push({ type: 'Principal', amount: data.totalAward, status: 'CLEARED', date: 'ORIGIN', isOrigin: true });
                }

                renderLedger(currentData);
            });
        });

        function renderLedger(items) {
            const body = document.getElementById('ledgerBody');
            if(items.length === 0) {
                body.innerHTML = '<tr><td colspan="2" class="py-10 text-center text-xs font-bold text-slate-300">NO RECORDS</td></tr>';
                return;
            }

            body.innerHTML = items.map(item => {
                const sRaw = (item.status || 'PENDING').toUpperCase();
                let sClass = "pill-pending", sText = sRaw;
                
                if (["SUCCESS", "CLEARED", "APPROVED", "PAID"].includes(sRaw)) { sClass = "pill-cleared"; sText = "CLEARED"; }
                else if (["FAILED", "REJECTED", "DECLINED", "ON HOLD", "HOLD"].includes(sRaw)) { 
                    sClass = "pill-declined"; sText = sRaw.includes("HOLD") ? "ON HOLD" : "DECLINED"; 
                }

                const isCredit = ['GRANT', 'DEPOSIT', 'PRINCIPAL'].includes(item.type?.toUpperCase());
                
                return `
                    <tr>
                        <td>
                            <span class="date-display">${item.date}</span>
                            <span class="desc-main">${item.type || 'TRANSFER'}</span>
                            <span class="amt-display ${isCredit ? 'text-emerald-500' : 'text-red-600'}">
                                ${isCredit ? '+' : '-'}$${Number(item.amount).toLocaleString()}
                            </span>
                            ${(item.reason && sClass === 'pill-declined') ? `<div class="reason-box"><b>NOTE:</b> ${item.reason}</div>` : ''}
                        </td>
                        <td class="text-right">
                            <span class="status-pill ${sClass}">${sText}</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Search Logic
        document.getElementById('ledgerSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = currentData.filter(i => 
                i.type?.toLowerCase().includes(term) || 
                i.status?.toLowerCase().includes(term) ||
                i.amount?.toString().includes(term)
            );
            renderLedger(filtered);
        });
    </script>
</body>
</html>
