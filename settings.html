<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA | Identity & Access Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        :root { --navy: #001a33; --gold: #b69121; --slate: #64748b; }
        
        body { background: #f8fafc; font-family: 'Public Sans', sans-serif; margin: 0; color: #1e293b; }
        .gov-banner { background: #000; color: white; padding: 12px; text-align: center; font-size: 9px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; border-bottom: 3px solid var(--gold); }
        
        .profile-card {
            background: linear-gradient(135deg, var(--navy) 0%, #003366 100%);
            border-radius: 28px; padding: 30px; color: white;
            box-shadow: 0 20px 40px -10px rgba(0,26,51,0.3); position: relative; overflow: hidden;
        }

        .info-box { background: white; border-radius: 24px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 20px; }
        .info-row { display: flex; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid #f1f5f9; }
        
        .input-box { 
            width: 100%; padding: 18px; border: 2px solid #e2e8f0; border-radius: 18px; 
            font-size: 16px; font-weight: 700; outline: none; transition: 0.3s;
        }
        .input-box:focus { border-color: var(--gold); }

        .btn-action { 
            width: 100%; padding: 18px; border-radius: 18px; font-weight: 900; font-size: 12px; 
            text-transform: uppercase; cursor: pointer; border: none;
        }
        .btn-navy { background: var(--navy); color: white; }
        .btn-gold { background: var(--gold); color: white; }
        
        .alert-orange { background: #fff7ed; border: 1px solid #ffedd5; padding: 15px; border-radius: 15px; }
    </style>
</head>
<body class="pb-10">

    <div class="gov-banner"><i class="fas fa-user-shield mr-2"></i> Authorized Personnel Access Only</div>

    <div class="max-w-md mx-auto px-5 pt-8">
        
        <div class="profile-card mb-6">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center border border-white/20">
                    <i class="fas fa-fingerprint text-2xl text-gold"></i>
                </div>
                <div>
                    <h2 class="text-[10px] font-black uppercase text-white/60 tracking-widest">Registry ID</h2>
                    <p class="text-lg font-black tracking-tight" id="dispUid">SBA-AUTH-...</p>
                </div>
            </div>
            <div class="space-y-1">
                <p class="text-[10px] font-black uppercase text-white/40 tracking-widest">Full Legal Name</p>
                <p class="text-xl font-black" id="dispName">...</p>
            </div>
        </div>

        <div class="info-box">
            <div class="info-row">
                <span class="text-[10px] font-black text-slate-400 uppercase">System Status</span>
                <span class="text-[10px] font-black text-emerald-600"><i class="fas fa-circle text-[6px] mr-1 animate-pulse"></i> ENCRYPTED</span>
            </div>
            <div class="info-row">
                <span class="text-[10px] font-black text-slate-400 uppercase">Auth Email</span>
                <span class="text-[13px] font-bold text-navy" id="dispEmail">...</span>
            </div>
        </div>

        <div class="bg-white rounded-[32px] p-6 border border-slate-200">
            <div class="mb-8">
                <label class="text-[10px] font-black text-navy uppercase mb-2 block">Access Password</label>
                <input type="password" id="newPass" class="input-box" placeholder="Update Secure Password">
                <button id="updatePass" class="btn-action btn-navy mt-4"><i class="fas fa-key mr-2"></i> Sync Password</button>
            </div>

            <hr class="my-8 border-slate-100">

            <div>
                <label class="text-[10px] font-black text-navy uppercase mb-2 block">Disbursement PIN</label>
                <div class="alert-orange mb-4">
                    <p class="text-[9px] text-orange-800 font-bold uppercase leading-relaxed">
                        <i class="fas fa-shield-halved mr-1"></i> Required for Escrow Release. This 4-digit code authorizes the final movement of funds.
                    </p>
                </div>
                <input type="password" id="newPin" class="input-box text-center text-2xl tracking-[10px]" placeholder="0000" maxlength="4" inputmode="numeric">
                <button id="updatePin" class="btn-action btn-gold mt-4"><i class="fas fa-lock mr-2"></i> Set Secure PIN</button>
            </div>
        </div>

        <a href="dashboard.html" class="flex items-center justify-center gap-2 mt-8 text-[10px] font-black text-slate-400 uppercase">
            <i class="fas fa-arrow-left"></i> Return to Command Center
        </a>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            document.getElementById('dispEmail').innerText = user.email;
            
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById('dispName').innerText = data.fullName || "AUTHORIZED USER";
                document.getElementById('dispUid').innerText = `SBA-${user.uid.substring(0,8).toUpperCase()}`;
                if(data.transactionPin) document.getElementById('newPin').placeholder = "••••";
            }
        });

        document.getElementById('updatePass').onclick = async function() {
            const pass = document.getElementById('newPass').value;
            if (pass.length < 6) return alert("Security Notice: Password must be at least 6 characters.");
            
            this.disabled = true;
            try {
                await updatePassword(auth.currentUser, pass);
                alert("PROTOCOL SUCCESS: Credentials Updated.");
                document.getElementById('newPass').value = "";
            } catch (e) { 
                alert("AUTH ERROR: Please re-login to update sensitive security credentials."); 
            } finally { this.disabled = false; }
        };

        document.getElementById('updatePin').onclick = async function() {
            const pin = document.getElementById('newPin').value;
            if (pin.length !== 4 || isNaN(pin)) return alert("Format Error: 4-Digit Numeric PIN required.");
            
            this.disabled = true;
            try {
                await updateDoc(doc(db, "users", auth.currentUser.uid), { transactionPin: pin });
                alert("SECURE PIN ACTIVE: Use this to authorize future disbursements.");
                document.getElementById('newPin').value = "";
            } catch (e) { alert("SYSTEM SYNC ERROR: Link to treasury failed."); } 
            finally { this.disabled = false; }
        };
    </script>
</body>
</html>
