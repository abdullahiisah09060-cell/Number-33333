<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V15 | RECOVER ACCESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sky: #0ea5e9; --dark: #020617; }
        body { 
            background: var(--dark); 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
        }
        .glass { 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 20px; 
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        .input-group {
            background: rgba(0,0,0,0.3);
            border: 1px solid #1e293b;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .input-group:focus-within {
            border-color: var(--sky);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.2);
        }
        input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            width: 100%;
            height: 50px;
            padding: 0 1rem;
            font-size: 14px;
        }
        .btn-primary {
            background: var(--sky);
            height: 55px;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); }
        #loader { display: none; }
    </style>
</head>
<body class="p-5">

<div class="glass shadow-2xl">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-black italic text-sky-500 uppercase">TITAN V15</h1>
        <p class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">Access Recovery System</p>
    </div>

    <div id="recovery-form" class="space-y-4">
        <div class="input-group flex items-center px-4">
            <i class="fas fa-envelope text-slate-500"></i>
            <input type="email" id="email" placeholder="Registered Email">
        </div>

        <div class="input-group flex items-center px-4">
            <i class="fas fa-shield-alt text-slate-500"></i>
            <input type="number" id="pin" placeholder="Security PIN (4-6 Digits)">
        </div>

        <button id="recover-btn" class="w-full btn-primary text-white mt-4">
            <span id="btn-text">Verify Identity</span>
            <i id="loader" class="fas fa-circle-notch fa-spin"></i>
        </button>

        <p class="text-center text-[11px] text-slate-500 mt-6">
            Remembered it? <a href="index.html" class="text-sky-500 font-bold">Back to Login</a>
        </p>
    </div>

    <div id="result-box" class="hidden text-center space-y-4 py-4">
        <div class="w-16 h-16 bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center mx-auto text-2xl">
            <i class="fas fa-unlock-alt"></i>
        </div>
        <div>
            <p class="text-slate-400 text-xs">Identity Verified. Your Password is:</p>
            <h2 id="revealed-pass" class="text-2xl font-black text-white mt-2 tracking-widest">********</h2>
        </div>
        <a href="index.html" class="block w-full bg-slate-800 py-3 rounded-xl text-xs font-bold uppercase">Go to Login</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCq8CgTyNbKVbUm_GItIC7FAvTuNrNspxI",
        authDomain: "sba-portal-2026-f1253.firebaseapp.com",
        projectId: "sba-portal-2026-f1253",
        storageBucket: "sba-portal-2026-f1253.firebasestorage.app",
        messagingSenderId: "363290267220",
        appId: "1:363290267220:web:2a3e8601c11be5dd6e27c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { localCache: persistentLocalCache() });

    const recoverBtn = document.getElementById('recover-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('loader');

    recoverBtn.onclick = async () => {
        const email = document.getElementById('email').value.trim().toLowerCase();
        const pin = document.getElementById('pin').value.trim();

        if(!email || !pin) {
            alert("Please enter both Email and PIN");
            return;
        }

        // UI Loading
        btnText.style.display = 'none';
        loader.style.display = 'inline-block';
        recoverBtn.disabled = true;

        try {
            const q = query(collection(db, "users"), where("email", "==", email), where("securityPin", "==", pin));
            const snap = await getDocs(q);

            if(!snap.empty) {
                const userData = snap.docs[0].data();
                document.getElementById('recovery-form').classList.add('hidden');
                document.getElementById('result-box').classList.remove('hidden');
                document.getElementById('revealed-pass').innerText = userData.password;
            } else {
                alert("Incorrect Email or PIN. Check your details and try again.");
            }
        } catch (e) {
            console.error(e);
            alert("System Error. Try again later.");
        } finally {
            btnText.style.display = 'inline-block';
            loader.style.display = 'none';
            recoverBtn.disabled = false;
        }
    };
</script>

</body>
</html>
