<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBA | Recovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; font-family: sans-serif; }
        .box { background: white; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border-top: 5px solid #002e6d; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md box p-8">
        <div class="text-center mb-8">
            <i class="fas fa-user-lock text-4xl text-[#002e6d] mb-4"></i>
            <h1 class="text-xl font-black uppercase text-slate-800">Credential Recovery</h1>
            <p class="text-xs font-bold text-slate-400 mt-2">LINK TO SECURE EMAIL TO RESET ACCESS</p>
        </div>

        <div class="space-y-4">
            <input type="email" id="email" placeholder="Registered Email Address" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-lg outline-none font-bold text-sm focus:border-[#002e6d]">
            <button id="resetBtn" class="w-full bg-[#002e6d] text-white py-4 rounded-lg font-black uppercase text-xs tracking-widest shadow-lg">Send Recovery Link</button>
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-[10px] font-black text-slate-400 hover:text-[#002e6d] uppercase tracking-widest">
                <i class="fas fa-arrow-left mr-1"></i> Return to Login
            </a>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        document.getElementById('resetBtn').onclick = async function() {
            const email = document.getElementById('email').value.trim();
            if(!email) return alert("Email Required.");

            this.disabled = true;
            try {
                await sendPasswordResetEmail(auth, email);
                alert("RECOVERY SUCCESS: Check your inbox for the reset link.");
                window.location.href = 'index.html';
            } catch (e) {
                alert("ERROR: Email not found in SBA Registry.");
            } finally { this.disabled = false; }
        };
    </script>
</body>
</html>
