<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V15 | SUPREME ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Libre+Barcode+39&display=swap');
        :root { --sky: #0ea5e9; --rose: #f43f5e; --emerald: #10b981; --dark: #020617; }
        body { background: var(--dark); color: #f1f5f9; font-family: 'Inter', sans-serif; font-size: 12px; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
        .pane { display: none; } 
        .pane.active { display: block; }
        .irs-paper { background: white; color: black; padding: 40px; font-family: 'Times New Roman', serif; width: 100%; max-width: 550px; margin: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .official-seal { border: 4px double #8b0000; color: #8b0000; padding: 8px; font-weight: 900; transform: rotate(-15deg); text-transform: uppercase; font-size: 10px; text-align: center; }
        .nav-dock { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: rgba(7, 10, 20, 0.95); display: grid; grid-template-columns: repeat(5, 1fr); padding: 12px 0 25px; border-top: 1px solid #1e293b; z-index: 9000; }
        .nav-item { text-align: center; color: #64748b; font-size: 9px; font-weight: 900; cursor: pointer; }
        .nav-item.active { color: var(--sky); }
        .badge { position: absolute; top: -5px; right: 20%; background: var(--rose); color: white; border-radius: 10px; padding: 1px 6px; font-size: 8px; }
    </style>
</head>
<body class="flex justify-center">

<div class="w-full max-w-[500px] min-h-screen pb-32 relative">
    <header class="p-5 sticky top-0 bg-slate-900/90 backdrop-blur-md z-[8000] border-b border-slate-800 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic text-sky-500">TITAN <span class="text-white">V15</span></h1>
            <p id="total-users" class="text-[9px] font-bold text-slate-500 uppercase">CITIZENS: 0</p>
        </div>
        <div class="flex gap-2">
            <button onclick="location.reload()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-400 border border-slate-700"><i class="fas fa-sync-alt"></i></button>
            <button id="logout-btn" class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-500 border border-rose-500/20"><i class="fas fa-power-off"></i></button>
        </div>
    </header>

    <div class="p-4"><input type="text" id="main-search" placeholder="Search citizens..." class="w-full h-12 bg-slate-800/50 border border-slate-700 rounded-2xl px-5 text-xs text-white outline-none"></div>

    <main class="px-4 space-y-4">
        <div id="pane-users" class="pane active space-y-3"></div>
        <div id="pane-tasks" class="pane space-y-3">
            <div id="task-list" class="space-y-3"></div>
        </div>
        <div id="pane-messages" class="pane space-y-2"><div id="chat-list" class="space-y-2"></div></div>
        <div id="pane-ledger" class="pane space-y-1"><div id="full-logs" class="space-y-1"></div></div>
    </main>

    <nav class="nav-dock">
        <div class="nav-item active" onclick="go('users', this)"><i class="fas fa-users-cog block text-lg"></i>Users</div>
        <div class="nav-item relative" onclick="go('tasks', this)"><i class="fas fa-bolt block text-lg"></i>Tasks<span id="t-badge" class="badge hidden">0</span></div>
        <div class="nav-item relative" onclick="go('messages', this)"><i class="fas fa-comment-alt block text-lg"></i>Chat<span id="m-badge" class="badge hidden">0</span></div>
        <div class="nav-item" onclick="go('ledger', this)"><i class="fas fa-terminal block text-lg"></i>Logs</div>
    </nav>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { collection, onSnapshot, doc, updateDoc, getDoc, deleteDoc, addDoc, arrayUnion, increment, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const ADMIN = "liger4683@gmail.com";
    let users = [];

    onAuthStateChanged(auth, u => { if(u && u.email === ADMIN) sync(); else window.location.href="login.html"; });

    function sync() {
        onSnapshot(collection(db, "users"), snap => {
            users = []; let tC = 0;
            snap.forEach(d => {
                if(d.data().email !== ADMIN) {
                    const data = { id: d.id, ...d.data() };
                    users.push(data);
                    if([data.kycStatus, data.applyStatus, data.depositStatus, data.taxStatus, data.withdrawStatus, data.awardStatus].includes('PENDING')) tC++;
                }
            });
            document.getElementById('total-users').innerText = "CITIZENS: " + users.length;
            document.getElementById('t-badge').innerText = tC; document.getElementById('t-badge').classList.toggle('hidden', tC === 0);
            render();
        });

        onSnapshot(query(collection(db, "logs"), orderBy("timestamp", "desc"), limit(50)), snap => {
            const grid = document.getElementById('full-logs'); grid.innerHTML = "";
            snap.forEach(l => {
                const log = l.data();
                grid.innerHTML += `<div class="p-3 bg-slate-800/30 rounded-lg text-[8px] font-mono border border-white/5 mb-1">${log.targetUser}: ${log.action}</div>`;
            });
        });
    }

    function render() {
        const uDiv = document.getElementById('pane-users'); uDiv.innerHTML = "";
        const tDiv = document.getElementById('task-list'); tDiv.innerHTML = "";
        
        users.forEach(u => {
            uDiv.innerHTML += `
            <div class="glass p-4 border-l-4 border-slate-700 mb-3">
                <div class="flex justify-between">
                    <div><h4 class="font-black text-white">${u.fullName || 'User'}</h4><p class="text-[8px] text-slate-500">${u.email}</p></div>
                    <div class="text-right"><p class="text-emerald-400 font-black">$${Number(u.balance || 0).toLocaleString()}</p></div>
                </div>
            </div>`;

            if(u.kycStatus === 'PENDING') tDiv.innerHTML += task(u.id, u.fullName, 'KYC Verification', null, 'kyc', 0);
            if(u.applyStatus === 'PENDING') tDiv.innerHTML += task(u.id, u.fullName, `Grant Apply`, null, 'apply', u.requestedAmount);
            if(u.depositStatus === 'PENDING') tDiv.innerHTML += task(u.id, u.fullName, `Deposit Proof`, [u.depositProof], 'deposit', u.depositAmount);
            if(u.withdrawStatus === 'PENDING') tDiv.innerHTML += task(u.id, u.fullName, `Withdrawal`, null, 'withdraw', u.withdrawAmount);
        });
    }

    function task(uid, name, title, imgs, type, amt) {
        return `<div class="glass p-5 border-l-4 border-amber-500">
            <h4 class="font-black text-white">${name}</h4>
            <p class="text-amber-500 font-black italic">${title}</p>
            <div class="flex gap-3 mt-5">
                <button onclick="processTask('${uid}','${type}','SUCCESSFUL', ${amt})" class="flex-1 bg-emerald-600 h-11 rounded-xl font-black text-[10px]">APPROVE</button>
                <button onclick="processTask('${uid}','${type}','FAILED', ${amt})" class="flex-1 bg-rose-600/20 text-rose-500 h-11 rounded-xl font-black text-[10px]">DECLINE</button>
            </div>
        </div>`;
    }

    window.processTask = async (uid, type, status, amt) => {
        let note = status === 'FAILED' ? prompt("REASON:") : "";
        const ref = doc(db, "users", uid);
        
        const updateData = {};
        updateData[`${type}Status`] = status;
        if(note) updateData[`${type}Note`] = note;

        // Ledger Entry Logic
        const ledgerEntry = {
            date: new Date().toLocaleString(),
            type: type.toUpperCase(),
            amount: amt,
            status: status,
            reason: note || "System Verified"
        };

        if(status === 'SUCCESSFUL' && (type === 'apply' || type === 'deposit')) updateData.balance = increment(Number(amt));
        
        // Push to user's personal ledger array
        updateData.ledger = arrayUnion(ledgerEntry);

        await updateDoc(ref, updateData);
        await addDoc(collection(db, "logs"), { targetUser: uid, action: `${status}: ${type}`, timestamp: new Date().toISOString() });
    };

    window.go = (id, el) => {
        document.querySelectorAll('.pane, .nav-item').forEach(x => x.classList.remove('active'));
        document.getElementById('pane-'+id).classList.add('active'); el.classList.add('active');
    };
</script>
</body>
</html>
