<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { collection, onSnapshot, doc, updateDoc, getDoc, addDoc, arrayUnion, increment, deleteDoc, query, orderBy, limit, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const ADMIN_EMAIL = "liger4683@gmail.com"; 

    onAuthStateChanged(auth, u => {
        if(u && u.email === ADMIN_EMAIL) {
            startSync();
        } else {
            window.location.href = "index.html";
        }
    });

    let citizens = [];

    function setLoader(percent) { document.getElementById('loader-line').style.width = percent + '%'; }

    function startSync() {
        setLoader(30);
        document.getElementById('master-search').oninput = render;

        onSnapshot(doc(db, "system", "config"), s => {
            if(s.exists()){
                document.getElementById('forge-ir').value = s.data().interestRate || 0;
                document.getElementById('forge-status').value = s.data().status || 'LIVE';
            }
        });

        onSnapshot(collection(db, "users"), snap => {
            citizens = [];
            let tasksCount = 0; let msgsCount = 0;
            snap.forEach(d => {
                if(d.data().email !== ADMIN_EMAIL) {
                    const u = { id: d.id, ...d.data() };
                    citizens.push(u);
                    // Updated Task Logic: Listen for kyc, apply, award, withdraw, or deposit
                    if(u.kycStatus === 'UNDER_REVIEW' || u.applyStatus === 'PENDING' || u.awardStatus === 'PENDING' || u.withdrawStatus === 'PENDING' || u.depositStatus === 'PENDING') tasksCount++;
                    if(u.chatHistory?.length && u.chatHistory[u.chatHistory.length-1].sender === 'USER') msgsCount++;
                }
            });
            document.getElementById('total-users').innerText = citizens.length;
            document.getElementById('badge-t').innerText = tasksCount;
            document.getElementById('badge-t').classList.toggle('hidden', tasksCount === 0);
            document.getElementById('badge-m').innerText = msgsCount;
            document.getElementById('badge-m').classList.toggle('hidden', msgsCount === 0);
            render();
            setLoader(100); setTimeout(() => setLoader(0), 500);
        });

        // LEDGER SYNC: Optimized to show in Global Audit Trail
        onSnapshot(query(collection(db, "logs"), orderBy("timestamp", "desc"), limit(40)), snap => {
            const grid = document.getElementById('ledger-grid');
            grid.innerHTML = "";
            snap.forEach(l => {
                const log = l.data();
                const timeStr = log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : '--';
                grid.innerHTML += `
                <div class="ledger-item">
                    <span class="text-sky-500">[${timeStr}]</span> 
                    <span class="text-white font-bold">${log.targetUser || 'System'}</span> 
                    <span class="${log.action.includes('DECLINED') ? 'text-rose-400' : 'text-emerald-400'}"> ${log.action}</span>
                </div>`;
            });
        });
    }

    function render() {
        const q = document.getElementById('master-search').value.toLowerCase();
        const userDiv = document.getElementById('user-grid');
        const taskDiv = document.getElementById('task-grid');
        const chatDiv = document.getElementById('chat-list');

        userDiv.innerHTML = ""; taskDiv.innerHTML = ""; chatDiv.innerHTML = "";

        citizens.forEach(u => {
            const isMatch = u.fullName?.toLowerCase().includes(q) || u.email?.toLowerCase().includes(q) || u.securityPin?.includes(q);
            if(!isMatch) return;

            userDiv.innerHTML += `
            <div class="glass p-4 border-t-2 border-sky-500 relative">
                <div class="absolute top-4 right-4 ${u.kycStatus === 'SUCCESSFUL' ? 'text-emerald-500' : 'text-slate-600'}"><i class="fas fa-shield-alt text-lg"></i></div>
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h4 class="font-black text-white text-[11px] uppercase">${u.fullName}</h4>
                        <p class="text-[8px] text-slate-400">${u.email}</p>
                        <p class="text-[9px] font-mono text-amber-500 mt-1">PIN: ${u.securityPin || '----'}</p>
                    </div>
                    <div class="text-right mr-8">
                        <p class="text-[15px] font-black text-emerald-400">$${Number(u.balance || 0).toLocaleString()}</p>
                        <p class="text-[7px] font-black text-slate-600 uppercase">Balance</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="openChat('${u.id}','${u.fullName}')" class="flex-1 h-9 bg-sky-600/10 text-sky-400 rounded-lg text-[9px] font-black uppercase border border-sky-600/20">Chat</button>
                    <button onclick="adjustBal('${u.id}')" class="w-20 h-9 bg-emerald-500/10 text-emerald-500 rounded-lg text-[9px] font-black border border-emerald-500/20">Fund</button>
                    <button onclick="deleteCitizen('${u.id}')" class="w-9 h-9 bg-rose-500/10 text-rose-500 rounded-lg border border-rose-500/20"><i class="fas fa-trash"></i></button>
                </div>
            </div>`;

            // TASK INJECTION: Handle both "apply" and "award" for the grant system
            if(u.kycStatus === 'UNDER_REVIEW') taskDiv.innerHTML += taskTemplate(u.id, u.fullName, 'KYC VERIFICATION', [u.idFront, u.idBack], 'kyc', 0);
            
            if(u.awardStatus === 'PENDING' || u.applyStatus === 'PENDING') {
                const amt = u.requestedAmount || u.balance || 0;
                taskDiv.innerHTML += taskTemplate(u.id, u.fullName, `GRANT AWARD: $${amt}`, null, 'award', amt);
            }
            
            if(u.withdrawStatus === 'PENDING') taskDiv.innerHTML += taskTemplate(u.id, u.fullName, `WITHDRAWAL: $${u.withdrawAmount}`, null, 'withdraw', u.withdrawAmount);
            if(u.depositStatus === 'PENDING') taskDiv.innerHTML += taskTemplate(u.id, u.fullName, `DEPOSIT PROOF: $${u.depositAmount}`, [u.depositProof], 'deposit', u.depositAmount);

            if(u.chatHistory?.length) {
                const last = u.chatHistory[u.chatHistory.length-1];
                chatDiv.innerHTML += `
                <div onclick="openChat('${u.id}','${u.fullName}')" class="glass p-4 flex justify-between items-center ${last.sender === 'USER' ? 'border-r-4 border-rose-500' : ''}">
                    <div><h4 class="font-black text-[10px] uppercase">${u.fullName}</h4><p class="text-[9px] text-slate-500 truncate w-48">${last.text || '📷 Image Message'}</p></div>
                    <span class="text-[7px] text-slate-600 uppercase font-black">ACTIVE</span>
                </div>`;
            }
        });
    }

    // PROCESS REQUEST: This is the engine that updates the user AND the ledger
    window.processRequest = async (uid, type, status, amount) => {
        let reason = "";
        if(status === 'DECLINED') {
            reason = prompt("Reason for rejection:");
            if(reason === null) return;
        }

        setLoader(50);
        const ref = doc(db, "users", uid);
        const uSnap = await getDoc(ref);
        const userData = uSnap.data();
        let up = {};

        if(type === 'kyc') up.kycStatus = status;
        
        if(type === 'award' || type === 'apply') { 
            up.awardStatus = status === 'SUCCESSFUL' ? 'APPROVED' : 'DECLINED';
            up.applyStatus = status === 'SUCCESSFUL' ? 'APPROVED' : 'DECLINED';
            up.awardDeclineReason = reason;
            // If approved, you can choose to auto-fund the balance here if you want
            if(status === 'SUCCESSFUL' && amount > 0) up.balance = increment(Number(amount));
        }

        if(type === 'withdraw') { 
            up.withdrawStatus = status; 
            if(status === 'DECLINED') up.balance = increment(Number(amount)); 
        }

        if(type === 'deposit') { 
            up.depositStatus = status; 
            if(status === 'SUCCESSFUL') up.balance = increment(Number(amount)); 
        }
        
        await updateDoc(ref, up);

        // WRITING TO LEDGER (logs collection)
        await addDoc(collection(db, "logs"), { 
            targetUser: userData.fullName, 
            action: `${status}: ${type.toUpperCase()} ($${amount})`, 
            timestamp: new Date().toISOString() 
        });

        setLoader(100); setTimeout(() => setLoader(0), 300);
    };

    window.adjustBal = async (uid) => {
        const amt = prompt("Amount to add (+) or subtract (-):");
        if(amt && !isNaN(amt)) {
            setLoader(50);
            const ref = doc(db, "users", uid);
            const uSnap = await getDoc(ref);
            await updateDoc(ref, { balance: increment(Number(amt)) });
            await addDoc(collection(db, "logs"), { 
                targetUser: uSnap.data().fullName, 
                action: `MANUAL FUND: ${amt}`, 
                timestamp: new Date().toISOString() 
            });
            setLoader(100); setTimeout(() => setLoader(0), 300);
        }
    };

    function taskTemplate(uid, name, title, imgs, type, amt) {
        let imgHtml = imgs ? `<div class="flex gap-2 my-2">` + imgs.map(i => i ? `<img src="${i}" class="w-14 h-14 object-cover rounded-lg border border-slate-700" onclick="viewImg('${i}')">` : '').join('') + `</div>` : '';
        return `
        <div class="glass p-4 border-l-4 border-amber-500">
            <h4 class="font-black text-white text-[11px] uppercase">${name}</h4>
            <p class="text-[9px] text-amber-500 font-black uppercase mt-1">${title}</p>
            ${imgHtml}
            <div class="flex gap-2 mt-4">
                <button onclick="processRequest('${uid}','${type}','SUCCESSFUL', ${amt})" class="flex-1 bg-emerald-600 h-9 rounded-lg font-black text-[9px] uppercase">Approve</button>
                <button onclick="processRequest('${uid}','${type}','DECLINED', ${amt})" class="flex-1 bg-rose-600/20 text-rose-500 h-9 rounded-lg font-black text-[9px] uppercase">Decline</button>
            </div>
        </div>`;
    }

    // Keep your Chat and UI functions same as before...
    window.openChat = (uid, name) => { /* same */ };
    window.switchTab = (id, el) => { /* same */ };
    // ...
</script>
